name: R tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libuv1-dev libcurl4-openssl-dev libssl-dev pkg-config
      - name: Install test dependencies
        run: Rscript --vanilla -e 'p <- c("testthat", "DBI", "RSQLite", "dplyr", "dbplyr", "maps", "plotly", "shiny", "jsonlite", "flexdashboard"); repo <- Sys.getenv("RSPM"); stopifnot(nzchar(repo)); install.packages(p, repos = repo); stopifnot(all(vapply(p, requireNamespace, logical(1), quietly = TRUE)))'
      - name: Run testthat suite
        run: Rscript --vanilla scripts/test.R
